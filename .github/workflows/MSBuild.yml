name: MSBuild

on:
  push:
    branches: [ main, stable/* ]
    paths-ignore:
      - 'coverage/**'
  pull_request:
    branches: [ main, stable/* ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  SOLUTION_FILE_PATH: build/src/AnkhSvn.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        path: build

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Add Subversion to PATH
      uses: ampscm/setup-subversion@v1


    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4.0

    - name: Setup version
      working-directory: build
      run: cmd.exe /C scripts\gh-version-setup ${{ github.run_number }}

    - name: Build 2022
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: >
        msbuild /m /v:m /restore /t:rebuild
        /p:UseVsSdkVersion=17.0
        /p:Configuration=Release
        ${{ env.SOLUTION_FILE_PATH }}
        @build\scripts\msbuild-version.rsp

    - name: Run Ankh.Tests with coverage
      id: ankh_tests
      continue-on-error: true
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: >
        dotnet test build/src/Ankh.Tests/Ankh.Tests.csproj
        --configuration Release
        --no-build
        --no-restore
        --collect:"XPlat Code Coverage"
        --results-directory "${{ github.workspace }}\TestResults\Ankh.Tests"
        --logger "console;verbosity=normal"
        -- RunConfiguration.TreatNoTestsAsError=true

    - name: Run Ankh.VS.UnitTest with coverage
      id: ankh_vs_tests
      continue-on-error: true
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: >
        dotnet test build/src/Ankh.VS.UnitTest/Ankh.VS.UnitTest.csproj
        --configuration Release
        --no-build
        --no-restore
        --collect:"XPlat Code Coverage"
        --results-directory "${{ github.workspace }}\TestResults\Ankh.VS.UnitTest"
        --logger "console;verbosity=normal"
        -- RunConfiguration.TargetPlatform=x64 RunConfiguration.TreatNoTestsAsError=true

    - name: Install ReportGenerator
      if: always()
      shell: pwsh
      run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

    - name: Generate coverage report
      if: always()
      shell: pwsh
      run: |
        $coverageFiles = Get-ChildItem "${{ github.workspace }}\TestResults" -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue
        if (-not $coverageFiles) {
          throw "No Coverlet coverage.cobertura.xml files were produced."
        }

        $reports = ($coverageFiles.FullName -join ";")
        Write-Host "Merging coverage reports:"
        $coverageFiles | ForEach-Object { Write-Host "  $($_.FullName)" }

        reportgenerator "-reports:$reports" "-targetdir:${{ github.workspace }}\CoverageReport" "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

        $summary = "${{ github.workspace }}\CoverageReport\SummaryGithub.md"
        if (Test-Path $summary) {
          Write-Host "Coverage summary:"
          Get-Content $summary | ForEach-Object {
            Write-Host $_
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_
          }
        }

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: AnkhSVN-Coverage-${{ github.run_number }}
        path: |
          TestResults
          CoverageReport
        if-no-files-found: error

    - name: Publish coverage to GitHub Pages
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        $source = "${{ github.workspace }}\CoverageReport"
        $target = "${{ github.workspace }}\build\coverage"

        if (-not (Test-Path (Join-Path $source "index.html"))) {
          throw "CoverageReport/index.html was not generated."
        }

        if (Test-Path $target) {
          Remove-Item $target -Recurse -Force
        }
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        Copy-Item (Join-Path $source "*") $target -Recurse -Force

        $metadata = [ordered]@{
          runNumber = "${{ github.run_number }}"
          runId = "${{ github.run_id }}"
          commit = "${{ github.sha }}"
          generatedUtc = (Get-Date).ToUniversalTime().ToString("o")
        } | ConvertTo-Json
        Set-Content -Path (Join-Path $target "build.json") -Value $metadata -Encoding UTF8

        Push-Location "${{ github.workspace }}\build"
        try {
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage
          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Coverage site is already current."
          }
          else {
            git commit -m "Update coverage report"
            git push origin HEAD:main
          }
        }
        finally {
          Pop-Location
        }
    - name: Verify VSIX contains Ankh.UI
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $vsix = "${{ github.workspace }}\build\src\Ankh.Package\bin\release\Ankh.Package.vsix"
        $archive = [System.IO.Compression.ZipFile]::OpenRead($vsix)
        try {
          $uiAssembly = $archive.Entries | Where-Object { $_.FullName -match '(^|/)Ankh\.UI\.dll$' } | Select-Object -First 1
          if (-not $uiAssembly) {
            throw "Ankh.UI.dll was not included in the generated VSIX"
          }
          Write-Host "Verified VSIX contains $($uiAssembly.FullName)"
        }
        finally {
          $archive.Dispose()
        }

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v6
      with:
        name: Ankh-VSIX-2022-${{ github.run_number }}
        path: build/src/Ankh.Package/bin/release/Ankh.Package.vsix

    - name: Verify test suites
      if: always()
      shell: pwsh
      run: |
        $failures = @()

        if ("${{ steps.ankh_tests.outcome }}" -ne "success") {
          $failures += "Ankh.Tests"
        }

        if ("${{ steps.ankh_vs_tests.outcome }}" -ne "success") {
          $failures += "Ankh.VS.UnitTest"
        }

        if ($failures.Count -gt 0) {
          throw ("Test suite failure(s): " + ($failures -join ", "))
        }

        Write-Host "Both test suites passed."

    - name: Prepare Release Files
      if: github.event_name != 'pull_request'
      shell: pwsh
      run: |
        $version = "2.9.${{ github.run_number }}"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\release" | Out-Null
        Copy-Item "${{ github.workspace }}\build\src\Ankh.Package\bin\release\Ankh.Package.vsix" "${{ github.workspace }}\release\AnkhSVN-$version-VS2022.vsix"
        Write-Host "Prepared AnkhSVN-$version-VS2022.vsix"

    - name: Create GitHub Package
      if: github.event_name != 'pull_request'
      shell: pwsh
      run: |
        $version = "2.9.${{ github.run_number }}"
        Write-Host "Creating AnkhSVN package version $version"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\package\out" | Out-Null
        Copy-Item "${{ github.workspace }}\build\src\Ankh.Package\bin\release\Ankh.Package.vsix" "${{ github.workspace }}\package\AnkhSVN-$version-VS2022.vsix"
        Copy-Item "${{ github.workspace }}\build\README.md" "${{ github.workspace }}\package\README.md"
        @"
        <?xml version="1.0"?>
        <package>
          <metadata>
            <id>AnkhSVN.VSIX.2022</id>
            <version>$version</version>
            <title>AnkhSVN for Visual Studio 2022</title>
            <authors>AnkhSVN Project</authors>
            <owners>AmpScm</owners>
            <requireLicenseAcceptance>false</requireLicenseAcceptance>
            <license type="expression">Apache-2.0</license>
            <readme>README.md</readme>
            <projectUrl>https://github.com/${{ github.repository }}</projectUrl>
            <description>
              AnkhSVN Subversion integration for Visual Studio 2022.
              This package contains the AnkhSVN Visual Studio VSIX installer.
            </description>
            <repository type="git" url="https://github.com/${{ github.repository }}" commit="${{ github.sha }}" />
            <tags>AnkhSVN SVN Subversion VisualStudio VSIX</tags>
          </metadata>
          <files>
            <file src="AnkhSVN-$version-VS2022.vsix" target="tools\AnkhSVN-$version-VS2022.vsix" />
            <file src="README.md" target="README.md" />
          </files>
        </package>
        "@ | Set-Content -Encoding UTF8 "${{ github.workspace }}\package\AnkhSVN.VSIX.2022.nuspec"
        nuget pack "${{ github.workspace }}\package\AnkhSVN.VSIX.2022.nuspec" -BasePath "${{ github.workspace }}\package" -OutputDirectory "${{ github.workspace }}\package\out"

    - name: Publish GitHub Package
      if: github.event_name != 'pull_request'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $package = Get-ChildItem "${{ github.workspace }}\package\out\*.nupkg" | Select-Object -First 1
        Write-Host "Publishing $($package.Name)"
        dotnet nuget push "$($package.FullName)" --api-key "$env:GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

    - name: Create GitHub Release
      if: github.event_name != 'pull_request'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "2.9.${{ github.run_number }}"
        $tag = "v$version"
        $vsix = "${{ github.workspace }}\release\AnkhSVN-$version-VS2022.vsix"
        $nupkg = Get-ChildItem "${{ github.workspace }}\package\out\*.nupkg" | Select-Object -First 1
        Write-Host "Creating release $tag"
        gh release create "$tag" "$vsix" "$($nupkg.FullName)" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AnkhSVN $version" --generate-notes
